name: Проверка сайтов каждые 30 минут

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v7
      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Проверить сайты
        run: node scripts/check.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Сохранить результаты в репозиторий
        run: |
          git config user.name "TR-Artem"
          git config user.email "129892323+TR-Artem@users.noreply.github.com"
          git add public/data/results.json
          if git diff --cached --quiet; then
            echo "Результаты не изменились"
            exit 0
          fi
          git commit -m "Результаты проверки"
          git push

  publish:
    needs: check
    uses: ./.github/workflows/deploy.yml
