name: Проверка алерта (временный)

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Отправить тестовое сообщение
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ.get('TOKEN', '')
          chat = os.environ.get('CHAT', '')
          if not token or not chat:
              print('MISSING_SECRETS', bool(token), bool(chat))
              raise SystemExit(1)
          payload = json.dumps({
              'chat_id': chat,
              'text': 'Мониторинг сайтов: проверка связи. Это тестовое сообщение, алерты настроены.',
          }).encode()
          req = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=payload,
              headers={'Content-Type': 'application/json'},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  d = json.load(r)
                  print('SEND_OK', d.get('ok'), d.get('result', {}).get('message_id'))
          except urllib.error.HTTPError as e:
              print('SEND_FAIL', e.code, e.read().decode()[:300])
              raise SystemExit(1)
          PY
